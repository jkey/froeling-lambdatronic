name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: arm64
    strategy:
      fail-fast: false
      matrix:
        image: ["python3.13-bookworm", "python3.14-bookworm"]
    container:
      # uv + Python vorinstalliert; kein node -> kein actions/checkout.
      image: ghcr.io/astral-sh/uv:${{ matrix.image }}
    steps:
      - name: Repo holen
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.seiler.onl/${{ github.repository }}.git" /src
          cd /src && git checkout "${{ github.sha }}"
      - name: Abhängigkeiten
        working-directory: /src
        run: uv sync --locked
      - name: Ruff
        working-directory: /src
        run: uv run ruff check && uv run ruff format --check
      - name: Mypy
        working-directory: /src
        run: uv run mypy
      - name: Tests
        working-directory: /src
        run: uv run pytest
